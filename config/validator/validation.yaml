App\Entity\Location:
    properties:
        city:
            - NotBlank:
                  groups: ['create', 'edit']
        country:
            - NotBlank:
                  groups: ['create', 'edit']
        latitude:
            - NotBlank:
                  groups: ['create']
            - Range:
                  min: -90
                  max: 90
                  groups: ['create', 'edit']
        longitude:
            - NotBlank:
                  groups: ['create']
            - Range:
                  min: -180
                  max: 180
                  groups: ['create', 'edit']

App\Entity\Measurement:
    properties:
        celsius:
            - NotBlank:
                  groups: ['create', 'edit']
            - Range:
                  min: -60
                  max: 50
                  groups: ['create', 'edit']
        date:
            - NotBlank:
                  groups: ['create']
        location:
            - NotNull:
                  groups: ['create', 'edit']
